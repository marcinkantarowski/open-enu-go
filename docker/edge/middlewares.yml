# =============================================================================
#  Middleware for every stack on a server's edge. Installed by edge.sh as
#  ${EDGE_HOME}/dynamic/_shared.yml; security-headers and rate-limit apply to
#  every request on websecure, noindex is added by compose.staging.yml.
# =============================================================================

# The TLS every router on the server edge negotiates. `default` is the name
# Traefik applies to a router that names no options, so no label carries it.
# TLS 1.3 is what Go negotiates whenever the client offers it - its suites are
# fixed by the protocol and not listed; 1.2 stays for older clients, with
# forward-secret AEAD suites only. Nothing older: 1.0 and 1.1 are deprecated
# (RFC 8996). Only on a server - locally Traefik's own default (1.2) applies,
# and each stack's dynamic file there would fight over one `default`.
tls:
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
      curvePreferences: [X25519, CurveP256, CurveP384]

http:
  middlewares:
    security-headers:
      headers:
        # HSTS. One year, subdomains included, and NOT preloaded - preloading is
        # effectively irreversible, and a boilerplate must not make that choice
        # for a domain it does not own.
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: false
        forceSTSHeader: true

        contentTypeNosniff: true
        browserXssFilter: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=()"

        customResponseHeaders:
          # Traefik's own version is not information a client needs.
          Server: ""
          X-Powered-By: ""

    rate-limit:
      # A coarse first layer in front of the application's own limiters, which
      # are per-endpoint and know the difference between a login and a list.
      # This one only stops a flood from reaching the API at all.
      rateLimit:
        average: 100
        burst: 200
        period: 1s

    # Staging only, applied by compose.staging.yml: keeps a staging copy of the product out
    # of search results. Indexed staging sites outrank nothing and confuse
    # everyone.
    noindex:
      headers:
        customResponseHeaders:
          X-Robots-Tag: "noindex, nofollow"
