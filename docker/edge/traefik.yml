# The edge's static config - shared by every project on this Docker host.
# Copied into ${EDGE_HOME} by scripts/dev/edge.sh, and mounted from there.
#
# Certificates come from each project's mkcert run via the file provider - no
# ACME locally, so the stack works offline. Traefik picks one by SNI.
global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

api:
  dashboard: true
  # Not `insecure: true` - each project routes the dashboard through the
  # websecure entrypoint at traefik.${DOMAIN}, from its dynamic file.

ping: {}

entryPoints:
  web:
    address: ":80"
    http:
      # Drop request headers whose name aliases another one (X_Forwarded_For for
      # X-Forwarded-For): backends that derive variable names from header names
      # (PHP, CGI) would read them as the header Traefik manages.
      aliasHeadersStrategy: delete
      redirections:
        # As on a server (traefik.server.yml): below every router, so that a
        # router naming `web` itself answers over plain HTTP here too.
        entryPoint: { to: websecure, scheme: https, permanent: false, priority: 1 }
  websecure:
    address: ":443"
    http:
      aliasHeadersStrategy: delete
  # Internal only: `ping` for the healthcheck, never published. Declared so it
  # gets the same header handling as the public entry points.
  traefik:
    address: ":8080"
    http:
      aliasHeadersStrategy: delete

providers:
  docker:
    # The socket proxy, never the socket itself (docker/edge/compose.yml).
    endpoint: "tcp://socket-proxy:2375"
    # Every project on the host is visible here. What keeps them apart is that
    # each prefixes its router and service names with its slug, and names the
    # network to reach it on (`traefik.docker.network`) - without that label,
    # Traefik may pick a network the edge is not attached to and answer 504.
    exposedByDefault: false
  file:
    directory: /etc/traefik/dynamic
    watch: true
